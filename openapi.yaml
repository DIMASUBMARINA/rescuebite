openapi: 3.0.3
info:
  title: RescueBite API
  description: |
    Dynamic Food Waste Recovery Platform for Almaty, Kazakhstan.

    Connects restaurants, consumers, shelters, and drivers to reduce food waste
    through progressive discounting and donation matching.
  version: 1.0.0
  contact:
    name: RescueBite Team
servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CONSUMER, RESTAURANT, SHELTER, DRIVER, ADMIN]
        phone:
          type: string
          nullable: true
        isVerified:
          type: boolean
        isSuspended:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, role]

    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [CONSUMER, RESTAURANT, SHELTER, DRIVER]
        phone:
          type: string
          nullable: true
      required: [email, password, role]

    LoginCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, refreshToken]

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        businessName:
          type: string
        address:
          type: string
        lat:
          type: number
          format: decimal
        lon:
          type: number
          format: decimal
        isVerified:
          type: boolean
        verificationStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
      required: [id, userId, businessName]

    RestaurantProfileInput:
      type: object
      properties:
        businessName:
          type: string
        address:
          type: string
        lat:
          type: number
        lon:
          type: number
      required: [businessName, address, lat, lon]

    Shelter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        shelterName:
          type: string
        charityRegNo:
          type: string
          nullable: true
        address:
          type: string
        lat:
          type: number
          format: decimal
        lon:
          type: number
          format: decimal
        isVerified:
          type: boolean
        verificationStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
      required: [id, userId, shelterName]

    ShelterProfileInput:
      type: object
      properties:
        shelterName:
          type: string
        charityRegNo:
          type: string
        address:
          type: string
        lat:
          type: number
        lon:
          type: number
      required: [shelterName, address, lat, lon]

    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        licenseNo:
          type: string
        vehiclePlate:
          type: string
        isActive:
          type: boolean
        isVerified:
          type: boolean
        verificationStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          type: string
          format: date-time
      required: [id, userId, licenseNo]

    DriverProfileInput:
      type: object
      properties:
        licenseNo:
          type: string
        vehiclePlate:
          type: string
      required: [licenseNo, vehiclePlate]

    Inventory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        originalPrice:
          type: number
        currentPrice:
          type: number
        state:
          type: string
          enum: [FRESH, DISCOUNTED, FREE, EXPIRED]
        quantity:
          type: integer
          default: 1
        reservedQty:
          type: integer
          default: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
            enum: [GLUTEN, DAIRY, EGGS, FISH, SHELLFISH, TREE_NUTS, PEANUTS, WHEAT, SOY, SESAME]
      required: [id, restaurantId, name, originalPrice, currentPrice, state, quantity, expiresAt]

    InventoryInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        originalPrice:
          type: number
        quantity:
          type: integer
          default: 1
        expiresAt:
          type: string
          format: date-time
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
            enum: [GLUTEN, DAIRY, EGGS, FISH, SHELLFISH, TREE_NUTS, PEANUTS, WHEAT, SOY, SESAME]
      required: [name, originalPrice, quantity, expiresAt]

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        inventoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          default: 1
        status:
          type: string
          enum: [PENDING, PAID, CONFIRMED, READY_FOR_PICKUP, IN_TRANSIT, DELIVERED, COMPLETED, CANCELLED]
        totalPrice:
          type: number
        reservedUntil:
          type: string
          format: date-time
          nullable: true
        deliveryAddress:
          type: string
          nullable: true
        deliveryLat:
          type: number
          nullable: true
        deliveryLon:
          type: number
          nullable: true
        deliveryFee:
          type: number
          nullable: true
        isDelivery:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, inventoryId, quantity, status, totalPrice]

    OrderInput:
      type: object
      properties:
        inventoryId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        deliveryAddress:
          type: string
        deliveryLat:
          type: number
          minimum: -90
          maximum: 90
        deliveryLon:
          type: number
          minimum: -180
          maximum: 180
      required: [inventoryId]

    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inventoryId:
          type: string
          format: uuid
        shelterId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, CLAIMED, EXPIRED]
        claimedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
      required: [id, inventoryId, shelterId, status]

    Pickup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [SHELTER_DELIVERY, CONSUMER_DELIVERY]
        status:
          type: string
          enum: [UNASSIGNED, ASSIGNED, IN_TRANSIT, DELIVERED, COMPLETED, CANCELLED]
        assignedAt:
          type: string
          format: date-time
          nullable: true
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
      required: [id, type, status]

    VerificationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [RESTAURANT, SHELTER, DRIVER]
        profileId:
          type: string
          format: uuid
        documentUrl:
          type: string
        documentType:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, profileType, profileId, documentUrl, documentType, status]

    VerificationInput:
      type: object
      properties:
        profileType:
          type: string
          enum: [RESTAURANT, SHELTER, DRIVER]
        profileId:
          type: string
          format: uuid
        documentType:
          type: string
        documentUrl:
          type: string
          format: uri
      required: [profileType, profileId, documentType, documentUrl]

    VerificationReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        note:
          type: string
      required: [status]

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
        entityId:
          type: string
        action:
          type: string
        field:
          type: string
          nullable: true
        oldValue:
          type: string
          nullable: true
        newValue:
          type: string
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
      required: [id, entity, entityId, action, newValue, changedBy]

    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
        message:
          type: string

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create account with role CONSUMER, RESTAURANT, SHELTER, or DRIVER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      description: Authenticate and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /profile/restaurant:
    post:
      tags: [Profile Management]
      summary: Create restaurant profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantProfileInput'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Restaurant'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile/shelter:
    post:
      tags: [Profile Management]
      summary: Create shelter profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShelterProfileInput'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Shelter'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile/driver:
    post:
      tags: [Profile Management]
      summary: Create driver profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileInput'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Driver'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /verification/submit:
    post:
      tags: [Verification]
      summary: Submit verification document
      description: Upload document for admin review (required for profile activation)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
      responses:
        '201':
          description: Document submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VerificationDocument'
        '403':
          description: Not authorized to submit for this profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /inventory:
    get:
      tags: [Inventory]
      summary: List inventory items
      description: List all items with optional state filter and pagination
      security:
        - BearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [FRESH, DISCOUNTED, FREE, EXPIRED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of inventory items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Inventory'

    post:
      tags: [Inventory]
      summary: Create inventory item
      description: Restaurant lists surplus food (FRESH state only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInput'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Inventory'
        '403':
          description: Restaurant role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /inventory/{id}:
    patch:
      tags: [Inventory]
      summary: Update inventory item
      description: Can only edit items in FRESH state
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                originalPrice:
                  type: number
                quantity:
                  type: integer
                expiresAt:
                  type: string
                  format: date-time
                ingredients:
                  type: array
                  items:
                    type: string
                allergens:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Can only edit FRESH items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Inventory]
      summary: Delete inventory item
      description: Cannot delete if active orders or claims exist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Active orders or claims exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders:
    post:
      tags: [Orders]
      summary: Create order
      description: |
        Consumer purchases item. Allergy check enforced.
        Supports quantity (1-10 units).
        10-minute reservation hold.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created with reservation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Order'
                      reservationExpires:
                        type: string
                        format: date-time
        '400':
          description: Allergy safety block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Item not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Pay for order
      description: Mock payment - no actual charge processed
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '410':
          description: Reservation expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      description: Can only cancel PENDING orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Can only cancel pending orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/picked-up:
    post:
      tags: [Orders]
      summary: Mark order picked up by consumer
      description: For pickup orders (not delivery)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /orders/my-orders:
    get:
      tags: [Orders]
      summary: List consumer orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'

  /orders/my-restaurant-orders:
    get:
      tags: [Orders]
      summary: List restaurant orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of orders for restaurant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'

  /orders/{id}/confirm:
    post:
      tags: [Orders]
      summary: Confirm order (Restaurant)
      description: Restaurant confirms paid order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Not authorized - not your restaurant's order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{id}/ready:
    post:
      tags: [Orders]
      summary: Mark order ready for pickup
      description: |
        Restaurant marks order as ready. Triggers email notification to consumer.
        For delivery orders, creates pickup task.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order ready, email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /shelters/available-donations:
    get:
      tags: [Shelters]
      summary: List available donations
      description: FREE items within 10km of verified shelter
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of free items with distances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Inventory'
                            - properties:
                                distance_km:
                                  type: number

  /shelters/claims:
    post:
      tags: [Shelters]
      summary: Claim free food
      description: |
        First-come-first-served with 30-minute claim window.
        Only verified shelters can claim.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
                  format: uuid

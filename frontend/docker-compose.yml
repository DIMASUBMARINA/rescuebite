version: '3.8'

services:
  backend:
    build: .
    container_name: rescuebite-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rescuebite?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rescuebite-network

  frontend:
    build: ./frontend
    container_name: rescuebite-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rescuebite-network

  postgres:
    image: postgres:15-alpine
    container_name: rescuebite-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rescuebite
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rescuebite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rescuebite-network

volumes:
  postgres-data:

networks:
  rescuebite-network:
    driver: bridge